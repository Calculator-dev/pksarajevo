# Admin panel for news (/admin). Every saved post is committed to the repo as
# content/novosti/<slug>.md, which triggers a new deploy on Render.
# Editors log in with email + password through DecapBridge (no GitHub account needed);
# invite them from the DecapBridge dashboard.
backend:
  name: git-gateway
  repo: Calculator-dev/pksarajevo
  branch: master
  # From the DecapBridge dashboard: replace DECAPBRIDGE_SITE_ID with your site's ID.
  identity_url: https://auth.decapbridge.com/sites/DECAPBRIDGE_SITE_ID
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: "novosti: dodaj „{{slug}}“ ({{author-name}})"
    update: "novosti: uredi „{{slug}}“ ({{author-name}})"
    delete: "novosti: obriši „{{slug}}“ ({{author-name}})"
    uploadMedia: "novosti: dodaj sliku {{path}} ({{author-name}})"
    deleteMedia: "novosti: obriši sliku {{path}} ({{author-name}})"

# Lets `npx decap-server` + http://localhost:3000/admin/index.html edit local files without logging in.
local_backend: true

site_url: https://www.pksarajevo.com
display_url: https://www.pksarajevo.com
logo_url: /images/pks-logo.png

locale: hr

media_folder: public/images/novosti
public_folder: /images/novosti

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: novosti
    label: Novosti
    label_singular: Novost
    folder: content/novosti
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    summary: "{{date | date('DD.MM.YYYY')}} · {{title}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Naslov, widget: string }
      - name: date
        label: Datum
        widget: datetime
        format: YYYY-MM-DD
        date_format: DD.MM.YYYY
        time_format: false
        default: "{{now}}"
      - name: category
        label: Kategorija
        widget: select
        options: [Uspjesi, Takmičenja, Klub, Obavijesti]
        default: Uspjesi
      - name: summary
        label: Kratki opis
        hint: 1–2 rečenice. Prikazuje se na listi novosti i u Google rezultatima.
        widget: text
      - { name: image, label: Naslovna slika, widget: image }
      - name: imageAlt
        label: Opis slike
        hint: Kratko opišite šta je na slici (važno za pristupačnost i SEO).
        widget: string
      - name: body
        label: Tekst
        widget: markdown
      - name: gallery
        label: Galerija
        label_singular: fotografiju
        hint: Dodatne fotografije, prikazuju se ispod teksta. Kliknite „Dodaj“ za svaku novu fotografiju.
        widget: list
        required: false
        summary: "{{fields.alt}}"
        fields:
          - { name: image, label: Fotografija, widget: image }
          - { name: alt, label: Opis fotografije, widget: string, required: false }
      - { name: source, label: Izvor (npr. TVSA), widget: string, required: false }
      - { name: sourceUrl, label: Link na izvor, widget: string, required: false }
      - name: draft
        label: Skica (ne objavljuj još)
        widget: boolean
        default: false
        required: false
